<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>C.E El Catllar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
    <header class="cabeza">
        <img src="Elcatllar_200x200.png" alt="Escut" class="escudo">
        <div class="titulos">
            <h1>C.E El Catllar</h1>
            <h2>Fem poble! Fem Catllar! Fem Esport!</h2>
        </div>
        <nav class="navegacion" aria-label="Navegación principal">
            <ul>
                <li>Primer equip</li>
                <li>Futbol base</li>
                <li>Coneix-nos</li>
                <li>Apunta't</li>
            </ul>
        </nav>
    </header>

    <main class="contenido-inicio">
        <aside class="menus-inicio" aria-label="Informació del club">
            <section class="menu-grupo">
                <h2>ÚLTIMES NOVETATS DEL PRIMER EQUIP A PRIMERA CATALANA:</h2>
                <a href="https://www.fcf.cat/ca/competicio/2026-2027/primera-catalana/grup-3/resultats" target="_blank"><button type="button">Consulta la FCF →</button></a>
            </section>

            <section class="menu-grupo menu-base">
                <h2>ÚLTIMES NOVETATS DEL NOSTRE FUTBOL BASE:</h2>
                <a href="resultats.html"><button type="button">Resultats →</button></a>
                <a href="fotos.html"><button type="button">Fotos →</button></a>
            </section>

            <section class="menu-grupo menu-apunta">
                <h2>Vols jugar amb nosaltres?</h2>
                <a href="apunta.html"><button type="button">Apunta't!</button></a>  
            </section>
        </aside>

        <div class="recuadros-partido">
            <section class="recuadro-partido">
                <h2>Últim partit:</h2>
                <div id="ultim-partit" class="partido-info"><p>Carregant…</p></div>
            </section>

            <section class="recuadro-partido">
                <h2>Pròxim partit:</h2>
                <div id="proxim-partit" class="partido-info"><p>Carregant…</p></div>
            </section>
        </div>
        
    </main>
    <script>
        // [CONFIGURACIÓ]
        // URL del proxy CORS que fa de mitjà entre el navegador i la FCF (la FCF bloquea CORS directes).
        const PROXY = "https://goalapi.juansureda.workers.dev/?url=";
        const FCF_URL = "https://www.fcf.cat/api/competition/partidos?grupId=58161859";
        const NOMBRE_CLUB = "EL CATLLAR";
        // Els escuds es troben a files.fcf.cat/escudos/clubes/escudos/ + nom del fitxer (camp ESCUDO_CASA / ESCUDO_FUERA de l'API)
        const ESCUDO_BASE = "https://files.fcf.cat/escudos/clubes/escudos/";

        // [FORMATAR DATA]
        // Converteix una data ISO (ex: 2026-11-14T18:00:00) a format llegible en català.
        function formatearDataHora(comienzo) {
            const fecha = new Date(comienzo);
            if (Number.isNaN(fecha.getTime())) return "";

            const data = new Intl.DateTimeFormat("ca-ES", {
                day: "numeric",
                month: "long",
                year: "numeric"
            }).format(fecha);
            const hora = new Intl.DateTimeFormat("ca-ES", {
                hour: "2-digit",
                minute: "2-digit"
            }).format(fecha);

            return `${data} ${hora}`;
        }

        // [RENDITZAR]
        // Crea els elements HTML (equipos, marcador, data, camp) i els insereix al div corresponent.
        function renderizarPartido(contenedor, partido) {
            contenedor.replaceChildren();
            if (!partido) {
                contenedor.textContent = "No hi ha dades disponibles.";
                return;
            }

            const fila = document.createElement("div");
            const escudoCasa = document.createElement("img");
            const info = document.createElement("div");
            const equipos = document.createElement("p");
            const marcador = document.createElement("strong");
            const fecha = document.createElement("p");
            const campo = document.createElement("p");
            const escudoFuera = document.createElement("img");

            fila.className = "fila-partido";
            escudoCasa.className = "escudo";
            escudoCasa.src = ESCUDO_BASE + partido.ESCUDO_CASA;
            escudoCasa.alt = partido.NOMBRE_CASA || "";
            info.className = "info-partido";
            equipos.className = "equipos";
            equipos.append(document.createTextNode(`${partido.NOMBRE_CASA || ""} `));
            marcador.textContent = partido.GOLES_CASA !== null
                ? `${partido.GOLES_CASA} - ${partido.GOLES_FUERA}`
                : "vs";
            equipos.append(marcador, document.createTextNode(` ${partido.NOMBRE_FUERA || ""}`));
            fecha.className = "fecha";
            fecha.textContent = `Jornada ${partido.JORNADA} · ${formatearDataHora(partido.COMIENZO1)}`;
            campo.className = "campo";
            campo.textContent = partido.CAMPO || "";
            escudoFuera.className = "escudo";
            escudoFuera.src = ESCUDO_BASE + partido.ESCUDO_FUERA;
            escudoFuera.alt = partido.NOMBRE_FUERA || "";

            info.append(equipos, fecha, campo);
            fila.append(escudoCasa, info, escudoFuera);
            contenedor.append(fila);
        }

        // [FETCH I FILTRAR]
        fetch(PROXY + encodeURIComponent(FCF_URL))
            // Comprova que la resposta HTTP és correcta i la converteix a JSON.
            .then(respuesta => {
                if (!respuesta.ok) throw new Error(`Error HTTP: ${respuesta.status}`);
                return respuesta.json();
            })
            // L'API de la FCF retorna un objecte {partidos: {1:[...], 2:[...]}}. Object.values().flat() l'aplaneja a un array únic de partits. Després filtra només els partits del nostre club, els separa en jugats (tenen GOLES_CASA) i pròxims (GOLES_CASA === null), i renderitza l'últim jugat i el pròxim.
            .then(respuesta => {
                const partidos = Object.values(respuesta.partidos).flat();
                if (!Array.isArray(partidos)) throw new Error("Formato de respuesta inesperado");
                console.log(partidos[0]);

                const partidosClub = partidos
                    .filter(partido =>
                        (partido.NOMBRE_CASA || "").toUpperCase().includes(NOMBRE_CLUB) ||
                        (partido.NOMBRE_FUERA || "").toUpperCase().includes(NOMBRE_CLUB)
                    );

                const jugados = partidosClub
                    .filter(partido => partido.GOLES_CASA !== null)
                    .sort((a, b) => new Date(b.COMIENZO1) - new Date(a.COMIENZO1));

                const proximos = partidosClub
                    .filter(partido => partido.GOLES_CASA === null)
                    .sort((a, b) => new Date(a.COMIENZO1) - new Date(b.COMIENZO1));

                renderizarPartido(document.getElementById("ultim-partit"), jugados[0]);
                renderizarPartido(document.getElementById("proxim-partit"), proximos[0]);
            })
            // Si alguna cosa falla (proxy caigut, xarxa, etc.), mostra un missatge d'error.
            .catch(error => {
                console.error("No s'han pogut carregar els partits de la FCF:", error);
                document.getElementById("ultim-partit").textContent = "Error en carregar dades.";
                document.getElementById("proxim-partit").textContent = "Error en carregar dades.";
            });
        // ============================================================
        // Aquest script és generat per IA per a la web del C.E El Catllar.
        // Font de dades: API interna de la FCF (no documentada oficialment).
        // Proxy CORS: goalapi.juansureda.workers.dev (projecte open-source).
        // Si el proxy deixa de funcionar, substituir PROXY per una altra
        // opció: https://api.allorigins.win/raw?url=
        // ============================================================
    </script>
</body>
</html>
